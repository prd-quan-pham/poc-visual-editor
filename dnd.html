<html lang="en">

<head>

<body>
    <main data-component="container" data-accepts="section" data-type="main">
        <section data-component="container" data-accepts="card" data-type="section"
            style="padding: 10px; border: 2px dashed blue; margin: 10px;">
            <div class="handle-section" style="cursor: move; background: blue; color: white; padding: 2px;">[Kéo Section
                1]</div>
            <h2>Section 1 (Chỉ chấp nhận Card)</h2>

            <div data-component="block" data-type="card" style="padding: 10px; border: 1px solid #ccc; margin: 5px;">
                <div class="handle-block" style="cursor: move; background: #eee;">[kéo]</div>
                <p>Card 1 - Click sửa text</p>
                <img src="https://helpx.adobe.com/content/dam/help/en/photoshop/using/convert-color-image-black-white/jcr_content/main-pars/before_and_after/image-before/Landscape-Color.jpg" alt="placeholder">
            </div>
            <div data-component="block" data-type="card" style="padding: 10px; border: 1px solid #ccc; margin: 5px;">
                <div class="handle-block" style="cursor: move; background: #eee;">[kéo]</div>
                <p>Card 2 - Click sửa text</p>
                <a href="#">Sửa link này</a>
            </div>
        </section>

        <section data-component="container" data-accepts="block,hero" data-type="section"
            style="padding: 10px; border: 2px dashed green; margin: 10px;">
            <div class="handle-section" style="cursor: move; background: green; color: white; padding: 2px;">[Kéo
                Section 2]</div>
            <h2>Section 2 (Chấp nhận Block)</h2>

            <div data-component="block" data-type="block" style="padding: 10px; border: 1px solid #ccc; margin: 5px;">
                <div class="handle-block" style="cursor: move; background: #eee;">[kéo]</div>
                <p>Block chung</p>
            </div>
        </section>
    </main>
    <script src="https://cdn.sites.paradox.ai/common-libraries/jquery/jquery-3.7.1.min.js"
        type="text/javascript"></script>
    <script src="https://cdn.sites.paradox.ai/common-libraries/embla-carousel/embla-carousel.umd.js"
        type="text/javascript"></script>
